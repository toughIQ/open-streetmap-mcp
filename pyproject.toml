[project]
name = "osm-mcp-server"
version = "0.3.2"
description = "An OpenStreetMap MCP server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
 "aiohttp==3.11.18",
 "mcp[cli]==1.30.0",
 "pillow==13.0.0",
 "reportlab>=4",
]
[[project.authors]]
name = "Jagan Shanmugam"
email = "jaganshanmugam@outlook.com"

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project.scripts]
osm-mcp-server = "osm_mcp_server:main"
